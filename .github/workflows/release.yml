# Release: compile real executables for every OS and publish them with versioned changelog notes.
#
# Trigger: pushing a version tag (v0.2.1). The release is published automatically only after every
# build and smoke job succeeds.
#
# workflow_dispatch is gated the same way, on `github.ref_type == 'tag'` rather than on the event:
# dispatching against a BRANCH runs build + smoke and publishes nothing (validating the pipeline
# without a tag), while dispatching against a TAG ref is a real, publishing release. That second
# case is not a curiosity — on 2026-08-06 a GitHub Actions incident throttled webhook triggers, so
# `git push origin v0.16.0` created the tag and fired no run at all. `gh workflow run release.yml
# --ref v0.16.0` was what actually shipped it. See docs/RELEASING.md.
#
# Design notes (verified 2026-07-16 against a real compiled exe on Windows):
# - `bun build --compile` cross-compiles every POSIX target (minified) from one Linux runner. The
#   windows-x64 leg runs on windows-latest UNMINIFIED: --minify alone panics Bun 1.3.14 when the
#   compile host is Windows (isolated locally; the exact same --minify is fine cross-compiling from
#   Linux). --windows-icon/--windows-title are host-gated to Windows but otherwise fine, so the
#   Windows leg applies them natively at compile time (no post-processing tool). What compiling does
#   NOT prove is that the binary RUNS — the smoke job boots each bundle on real hardware for its OS
#   and asserts /api/health, because the failure modes here (virtual import.meta.dir paths, the
#   implicit-serve entrypoint trap) all pass the build and only explode at runtime.
# - The SPA is embedded into the executable by scripts/build.ts. Windows publishes both a direct
#   exe and a smaller updater zip; Unix targets publish updater tarballs. Each archive has one
#   versioned wrapper directory holding the executable, plus (Windows only) the misc/ tray toolkit
#   the system-tray shortcut needs. That wrapper preserves the update path from older CC Manager UI
#   releases (the pre-rename name), whose updater expects it. There are no web/, node_modules/ or
#   source-map sidecars.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-x64 builds ON Windows so --windows-icon works; everything else cross-compiles
          # from one Linux runner.
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: darwin-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PKG_V=$(bun -e 'console.log(require("./package.json").version)')
          TAG_V="${GITHUB_REF_NAME#v}"
          if [ "$PKG_V" != "$TAG_V" ]; then
            echo "tag v$TAG_V does not match package.json version $PKG_V — bump package.json (and CHANGELOG) first"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web SPA
        run: bun run --cwd web build

      - name: Compile + package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          target="${{ matrix.target }}"
          name="AgentHydra-${VERSION}-${target}"
          stage="tmp/release-stage"
          rm -rf "$stage"
          mkdir -p "$stage/$name" out
          # THE ORCHESTRATOR (2026-09-03). The Python toolbox ships beside the executable so a
          # compiled daemon finds it at APP_ROOT/orchestrator (server/src/orchestrator.ts resolves
          # it there; GET /api/orchestrator says `present:false` otherwise). The python half only:
          # orch.py + scripts/ + docs. Never state/ (runtime, gitignored anyway), never the tests,
          # never the remote front-end (orchestrator/server + web need bun, which a compiled
          # bundle does not have). Python itself is the user's; the daemon reports its absence.
          mkdir -p "${stage}/${name}/orchestrator"
          cp orchestrator/orch.py orchestrator/orch_cli.py orchestrator/README.md \
             "${stage}/${name}/orchestrator/"
          cp -r orchestrator/scripts orchestrator/docs "${stage}/${name}/orchestrator/"
          rm -rf "${stage}/${name}/orchestrator/scripts/tests"
          find "${stage}/${name}/orchestrator" -name __pycache__ -type d -prune -exec rm -rf {} +
          if [ "$target" = "windows-x64" ]; then
            # NO --minify: on a WINDOWS compile host --minify alone panics Bun 1.3.14 outright
            # ("Crashed while printing main.ts" — isolated locally 2026-07-16 to --minify specifically;
            # --windows-icon/--windows-title are innocent, they only appeared guilty when paired with
            # --minify, and the same --minify works fine on the Linux legs). The native Windows
            # resource flags DO work on a Windows host (they're only unavailable when cross-compiling
            # from Linux), so the icon + title are applied at compile time — no rcedit post-step.
            # Unminified costs a few MB.
            bun run scripts/build.ts --skip-web --target "$target" \
              --outfile "${stage}/${name}/AgentHydra.exe"
            "${stage}/${name}/AgentHydra.exe" --version   # canary: the compiled exe runs
            cp "${stage}/${name}/AgentHydra.exe" "out/${name}.exe"
            # THE TRAY TOOLKIT. Staged after the standalone .exe is copied out, so that download
            # stays a single file and only the zip carries these.
            #
            # 0.11.2 dropped this step while trimming sidecars, and because the daemon contains no
            # tray code whatsoever (the icon is drawn by misc/lunarwerx-tray.exe, a separate
            # process), every bundle from 0.12.0 on could only run console-style. It presented as
            # "the tray icon is gone and no setting brings it back", which is unfixable from the
            # user's side and gives no clue that files are simply absent.
            #
            # AgentHydra-Tray.json resolves appRoot as ".." and compiledExe as "AgentHydra.exe",
            # so misc/ sitting beside the executable is exactly the layout it expects.
            mkdir -p "${stage}/${name}/misc"
            cp misc/lunarwerx-tray.exe misc/AgentHydra-Tray.json misc/AgentHydra.ico \
               misc/Create-Shortcut.ps1 misc/New-TrayShortcut.ps1 \
               misc/Instance-Launch.vbs "${stage}/${name}/misc/"
            # The `-Legacy` rollback (wscript + the WinForms PowerShell host) ships too: it is the
            # documented one-switch fallback if the native host ever misbehaves on a user's machine,
            # and a fallback that isn't in the bundle is not a fallback.
            cp misc/Tray-Host.ps1 misc/AgentHydra-Tray.ps1 misc/Tray-Launch.vbs \
               "${stage}/${name}/misc/"
            # windows-latest has 7z on PATH; git-bash there has no `zip`
            (cd "$stage" && 7z a -tzip "$GITHUB_WORKSPACE/out/${name}.zip" "$name" > /dev/null)
          else
            bun run scripts/build.ts --skip-web --target "$target" \
              --outfile "${stage}/${name}/agenthydra"
            tar -C "$stage" -czf "out/${name}.tar.gz" "$name"
          fi
          rm -rf "$stage"
          ls -la out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            out/*.zip
            out/*.tar.gz
            out/*.exe
          if-no-files-found: error
          # These are large binaries only consumed by the smoke + release jobs in THIS run
          # (or nobody, on a workflow_dispatch validation run). No reason to keep them 90 days.
          retention-days: 3

  # Boot each bundle and assert --version + /api/health + served SPA. This catches the
  # compiled-only runtime bugs a green compile can't (virtual import.meta.dir paths, the
  # implicit-serve trap). Native runners for x64 Linux / Windows / arm64 macOS; linux-arm64 is
  # booted under QEMU on the x64 runner (no free native ARM-Linux runner). darwin-x64 (Intel mac)
  # is the ONE target that stays build-only-verified: GitHub retired its Intel macOS runners, so
  # there is no honest way to boot it in CI — a documented, deliberate gap, not a silent one.
  smoke:
    name: smoke (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bin: agenthydra
          - os: ubuntu-latest
            target: linux-arm64
            bin: agenthydra
            qemu: true
          - os: windows-latest
            target: windows-x64
            bin: AgentHydra.exe
          - os: macos-latest # arm64 runner
            target: darwin-arm64
            bin: agenthydra
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.target }}
          path: out

      # linux-arm64 runs inside an arm64 container via binfmt/QEMU emulation on the x64 runner.
      - name: Set up QEMU (arm64 emulation)
        if: matrix.qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Unpack the bundle
        shell: bash
        run: |
          cd out
          case "${{ matrix.target }}" in
            windows-*) bundle=$(ls AgentHydra-*-${{ matrix.target }}.zip | head -1) ;;
            *) bundle=$(ls AgentHydra-*-${{ matrix.target }}.tar.gz | head -1) ;;
          esac
          echo "smoking $bundle"
          mkdir smoke
          case "$bundle" in
            *.zip) unzip -q "$bundle" -d smoke ;;
            *) tar -xzf "$bundle" -C smoke ;;
          esac
          test "$(find smoke -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          bundle_dir=$(find smoke -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$bundle_dir"
          echo "BUNDLE_DIR=out/$bundle_dir" >> "$GITHUB_ENV"
          # Windows: the tray toolkit must be in the bundle. It went missing for 8 releases
          # (0.12.0 through 0.19.0) with nothing failing, because a bundle without it still boots,
          # serves and passes every other check here. Only its absence is the bug, so absence is
          # what has to be asserted.
          case "${{ matrix.target }}" in
            windows-*)
              for f in lunarwerx-tray.exe AgentHydra-Tray.json AgentHydra.ico \
                       Create-Shortcut.ps1 New-TrayShortcut.ps1 Tray-Host.ps1 \
                       AgentHydra-Tray.ps1 Tray-Launch.vbs Instance-Launch.vbs; do
                test -f "$bundle_dir/misc/$f" || { echo "bundle is missing misc/$f"; exit 1; }
              done
              echo "tray toolkit present"
              ;;
          esac

      # THE ORCHESTRATOR PAYLOAD (AH-27). An archive missing orchestrator/orch.py boots and
      # serves fine — nothing in the boot+assert steps below ever imports it — so absence here
      # would ship silently, exactly like the tray toolkit gap above. Runs for every smoke
      # target (native and QEMU alike): this is a filesystem check on the unpacked archive, not
      # a runtime boot, so it needs no emulation. Checked against orchestrator/orch.py's own
      # assembly step (release.yml's "Compile + package" step): orch.py + scripts/ + docs/ are
      # shipped; scripts/tests/, scripts/**/__pycache__ and state/ are deliberately never shipped.
      - name: Assert orchestrator payload
        shell: bash
        run: |
          cd "$BUNDLE_DIR"
          missing() { echo "orchestrator payload is missing $1"; exit 1; }
          unexpected() { echo "orchestrator payload unexpectedly contains $1"; exit 1; }
          test -f orchestrator/orch.py || missing "orchestrator/orch.py"
          test -f orchestrator/scripts/lib/hydralib.py || missing "orchestrator/scripts/lib/hydralib.py"
          test -n "$(find orchestrator/scripts -maxdepth 1 -name '*.py' -print -quit)" \
            || missing "any orchestrator/scripts/*.py tool"
          if [ -d orchestrator/scripts/tests ]; then unexpected "orchestrator/scripts/tests/"; fi
          pycache=$(find orchestrator -name __pycache__ -print -quit)
          [ -n "$pycache" ] && unexpected "$pycache (compiled bytecode must never ship)"
          if [ -d orchestrator/state ] && [ -n "$(find orchestrator/state -mindepth 1 -print -quit)" ]; then
            unexpected "orchestrator/state/ (runtime state must never ship)"
          fi
          echo "orchestrator payload present, no runtime/test cruft"

      # The actual boot+assert, factored so native and QEMU paths run identical checks.
      - name: Boot + assert (native)
        if: '!matrix.qemu'
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
        run: |
          cd "$BUNDLE_DIR"
          chmod +x "$BIN" 2>/dev/null || true
          "./$BIN" --version
          export AGENTHYDRA_HOME="$RUNNER_TEMP/ccm-smoke-home"
          export AGENTHYDRA_NO_OPEN=1
          PORT=7797 "./$BIN" > daemon.out 2>&1 &
          ok=""
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7797/api/health > health.json 2>/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ -z "$ok" ]; then echo "daemon never served /api/health"; cat daemon.out; exit 1; fi
          cat health.json; echo
          grep -q '"service":"agenthydra"' health.json
          grep -q '"distribution":"compiled"' health.json
          curl -sf http://127.0.0.1:7797/ > index.html
          grep -qi '<!doctype html' index.html
          asset=$(grep -Eo "/assets/[^\"']+\.(js|css)" index.html | head -1)
          test -n "$asset"
          curl -sf "http://127.0.0.1:7797${asset}" > frontend-asset
          test -s frontend-asset

      - name: Boot + assert (arm64 under QEMU)
        if: matrix.qemu
        shell: bash
        run: |
          # arm64 Debian container (binfmt routes it through QEMU). --version proves the emulated
          # binary at least loads + runs; a full daemon boot under QEMU is slow/flaky, so the arm64
          # leg asserts the launch, and the native x64 leg covers the serving behavior.
          docker run --rm --platform linux/arm64 -v "$PWD/$BUNDLE_DIR:/app" -w /app \
            arm64v8/debian:stable-slim ./agenthydra --version

  release:
    name: publish the GitHub release
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no release section for ${GITHUB_REF_NAME}"
            exit 1
          fi
          # Which Windows download? The two Windows assets sit side by side with nothing at the
          # download point telling them apart, and the .exe is the bigger, more obvious, more "just
          # download the app" choice — and it is the one that CANNOT show a tray icon, because the
          # icon is drawn by misc/lunarwerx-tray.exe and a single file carries no misc/ folder. That
          # costs real users, who reasonably read a missing icon as a bug. Renaming the assets is
          # NOT the fix: the updater matches its archive by name (`-<target>.zip`), so a rename
          # silently breaks self-update for every install already out there. Saying it here is free
          # and lands exactly where the choice is made.
          #
          # ⛔ AND THE SAME IS NOW TRUE OF THE ORCHESTRATOR, one row down (2026-09-03). The python
          # toolbox is staged as a FOLDER beside the executable, so like misc/ it can only ride in
          # the zip — and this table used to end "Everything else is identical", which turned a
          # second silent omission into a written promise. An .exe install answers
          # GET /api/orchestrator with present:false and its four MCP tools do nothing. Whenever a
          # payload is staged into "${stage}/${name}/" rather than compiled INTO the binary, it is
          # absent from the single-file download by construction: say so here, in the same breath,
          # or this row grows a third quiet exception.
          cat >> RELEASE_NOTES.md <<'NOTE'

          ---

          ### Which Windows download?

          | file | tray icon | orchestrator | notes |
          | --- | --- | --- | --- |
          | `...-windows-x64.zip` | **yes** | **yes** | The executable plus the `misc\` tray toolkit and the `orchestrator\` toolbox. Double-click `AgentHydra.exe` and the daemon starts the tray launcher for you; or run `misc\Create-Shortcut.ps1` once for a shortcut that launches through it directly. |
          | `...-windows-x64.exe` | no | no | One portable file, nothing to unpack. A single file carries no `misc\` or `orchestrator\` folder, so no tray icon can appear whatever the in-app setting says, and the orchestrator tools report themselves as not installed. |

          Both self-update, and both are the same daemon. The zip is the complete install; the
          single file is the daemon alone, without the two folders that sit beside it — the tray
          toolkit and the orchestrator. Each says so plainly rather than looking broken: the .exe
          tells you about the tray icon once on first start, and `GET /api/orchestrator` answers
          `present:false` and names the folder it looked for.
          NOTE

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Build checksums
        shell: bash
        run: sha256sum out/* > out/SHA256SUMS.txt

      # Idempotent: a retry updates the existing release in place and replaces its platform assets
      # instead of deleting the release or creating an orphaned draft.
      - name: Publish release with binaries attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Archives go first so pre-transition updaters, which selected the first matching
            # target asset, receive a bundle rather than the new human-facing direct executable.
            gh release upload "$GITHUB_REF_NAME" out/*.zip out/*.tar.gz out/*.exe out/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHydra ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md \
              --draft=false
          else
            gh release create "$GITHUB_REF_NAME" out/*.zip out/*.tar.gz out/*.exe out/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHydra ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md
          fi
